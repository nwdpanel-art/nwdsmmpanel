services:
  - type: web
    name: nwd-panel
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: smm_panel
      - key: DB_SSL
        value: "1"
      - key: CRON_SECRET
        generateValue: true
